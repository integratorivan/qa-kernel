schemaVersion: 1
id: CAB-004
title: Reports section loads without an error
goal: Verify the Reports section shows read-only reports content
preconditions:
  - The user can sign in
data:
  emailFrom: QA_EMAIL
  passwordFrom: QA_PASSWORD
steps:
  - id: open-login
    instruction: Open the lab cabinet sign-in screen
  - id: sign-in
    instruction: Sign in with the approved credentials
  - id: open-reports
    instruction: Open Reports and wait for the request
oracle:
  source: product-requirement
  expect:
    - Reports content is visible
    - The reports request succeeds
  reject:
    - Reports failed to load
    - The section stays empty
safety:
  mutation: none
