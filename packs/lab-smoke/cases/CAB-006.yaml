schemaVersion: 1
id: CAB-006
title: Offscreen cabinet control is reachable after scroll
goal: Verify Below viewport appears after scrolling and can be clicked
preconditions:
  - The cabinet is visible
data:
  emailFrom: QA_EMAIL
  passwordFrom: QA_PASSWORD
steps:
  - id: open-login
    instruction: Open the lab cabinet sign-in screen
  - id: sign-in
    instruction: Sign in with the approved credentials
  - id: scroll-below
    instruction: Scroll until Below viewport is visible and click it
oracle:
  source: qa-heuristic
  expect:
    - Below viewport is found after scroll
    - Below control clicked is shown after the interaction
  reject:
    - The control stays undiscoverable after scroll
safety:
  mutation: none
