schemaVersion: 1
id: CAB-007
title: Slow check waits for the long XHR
goal: Verify Run slow check shows Slow check complete after the delayed request
preconditions:
  - The cabinet is visible
data:
  emailFrom: QA_EMAIL
  passwordFrom: QA_PASSWORD
steps:
  - id: open-login
    instruction: Open the lab cabinet sign-in screen
  - id: sign-in
    instruction: Sign in with the approved credentials
  - id: run-slow
    instruction: Click Run slow check and wait for the result
oracle:
  source: product-requirement
  expect:
    - Slow check complete is visible
  reject:
    - The verdict is made while the status is still loading
    - The action fails because the request is slow
safety:
  mutation: none
